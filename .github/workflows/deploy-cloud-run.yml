name: Cloud Run 스테이징 무중단 배포

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 릴리스 workflow가 출력한 Artifact Registry image@sha256 digest
        required: true
        type: string
      runtime_manifest_sha256:
        description: 이미지에 포함된 runtime_manifest.json SHA-256
        required: true
        type: string
      git_commit:
        description: runtime manifest와 이미지를 생성한 main commit SHA
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: 후보 리비전 검사·Blue Green 전환
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: 배포 commit 체크아웃
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_commit }}
          fetch-depth: 1

      - name: 배포 입력과 변수 검사
        shell: bash
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RUNTIME_MANIFEST_SHA256: ${{ inputs.runtime_manifest_sha256 }}
          RELEASE_GIT_COMMIT: ${{ inputs.git_commit }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_MODEL_API_KEY_SECRET: ${{ vars.GCP_MODEL_API_KEY_SECRET }}
          GCP_MODEL_API_KEY_SECRET_VERSION: ${{ vars.GCP_MODEL_API_KEY_SECRET_VERSION }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_GIT_COMMIT"
          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_ARTIFACT_REPOSITORY \
            GCP_CLOUD_RUN_SERVICE \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT \
            GCP_RUNTIME_SERVICE_ACCOUNT \
            GCP_MODEL_API_KEY_SECRET \
            GCP_MODEL_API_KEY_SECRET_VERSION
          do
            test -n "${!name:-}" || {
              echo "필수 GitHub Repository Variable이 없습니다: $name"
              exit 1
            }
          done
          expected_prefix="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/model-api@sha256:"
          case "$IMAGE_DIGEST" in
            "$expected_prefix"????????????????????????????????????????????????????????????????) ;;
            *) echo "허용된 Artifact Registry digest 형식이 아닙니다."; exit 1 ;;
          esac
          [[ "$IMAGE_DIGEST" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$RUNTIME_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_GIT_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Python 3.11 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Smoke client 의존성 설치
        run: python -m pip install --requirement requirements-production.txt

      - name: Google Cloud OIDC 인증
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Google Cloud CLI 설정
        uses: google-github-actions/setup-gcloud@v3

      - name: 후보 리비전 검사 후 무중단 전환
        id: deploy
        shell: bash
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RUNTIME_MANIFEST_SHA256: ${{ inputs.runtime_manifest_sha256 }}
          RELEASE_GIT_COMMIT: ${{ inputs.git_commit }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_MODEL_API_KEY_SECRET: ${{ vars.GCP_MODEL_API_KEY_SECRET }}
          GCP_MODEL_API_KEY_SECRET_VERSION: ${{ vars.GCP_MODEL_API_KEY_SECRET_VERSION }}
          GCP_MIN_INSTANCES: ${{ vars.GCP_MIN_INSTANCES }}
          GCP_MAX_INSTANCES: ${{ vars.GCP_MAX_INSTANCES }}
          CHEMIGUARD119_API_KEY: ${{ secrets.CHEMIGUARD119_API_KEY }}
        run: scripts/deployment/deploy_cloud_run_blue_green.sh

      - name: 배포 요약
        shell: bash
        run: |
          {
            echo "## Cloud Run 스테이징 배포 완료"
            echo
            echo "- Service: \`${{ vars.GCP_CLOUD_RUN_SERVICE }}\`"
            echo "- Region: \`${{ vars.GCP_REGION }}\`"
            echo "- Revision: \`${{ steps.deploy.outputs.revision }}\`"
            echo "- URL: \`${{ steps.deploy.outputs.service_url }}\`"
            echo "- Image: \`${{ inputs.image_digest }}\`"
            echo "- Previous revision: \`${{ steps.deploy.outputs.previous_revision }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
