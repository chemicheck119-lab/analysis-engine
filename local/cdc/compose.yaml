name: chemicheck119-cdc-local
services:
  kafka:
    image: apache/kafka:4.0.2
    ports: ['127.0.0.1:59092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: ['kafka-data:/tmp/kraft-combined-logs']
  connect:
    image: quay.io/debezium/connect:3.3
    ports: ['127.0.0.1:58083:8083']
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: chemicheck-local
      CONFIG_STORAGE_TOPIC: chemicheck-connect-config
      OFFSET_STORAGE_TOPIC: chemicheck-connect-offset
      STATUS_STORAGE_TOPIC: chemicheck-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    depends_on: [kafka]
    networks: [default, lake]
networks:
  lake:
    external: true
    name: chemicheck119-lakehouse-local_default
volumes:
  kafka-data:
