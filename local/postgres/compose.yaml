services:
  reference-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reference_lab
      POSTGRES_USER: postgres
      # Disposable local fixture DB only, bound to loopback; never use for deployment.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reference_lab"]
      interval: 2s
      timeout: 2s
      retries: 15
    # Container writable layer is deliberately disposable. No existing DB volume.
