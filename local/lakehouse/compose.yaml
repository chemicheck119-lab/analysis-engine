name: chemicheck119-lakehouse-local
services:
  postgres:
    image: postgres:17
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_slot_wal_keep_size=256MB]
    environment:
      POSTGRES_DB: reference_lab
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ['127.0.0.1:55433:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d reference_lab']
      interval: 2s
      timeout: 2s
      retries: 20
  object-fixture:
    # Local disk-backed S3 gateway; volume survives restart/recreation.
    image: versity/versitygw:v1.8.0
    command: [--port, ":5000", posix, /data]
    environment:
      ROOT_ACCESS_KEY: localfixture
      ROOT_SECRET_KEY: localfixtureonly
    volumes: ["reference-objects:/data"]
    ports: ['127.0.0.1:59000:5000']
  trino:
    image: trinodb/trino:483
    ports: ['127.0.0.1:58080:8080']
    volumes: ['./catalog:/etc/trino/catalog:ro']
    depends_on:
      postgres: {condition: service_healthy}
      object-fixture: {condition: service_started}

volumes:
  reference-objects:
